# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python test

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "40 14 * * 4"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install one_py_sdk flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test
        run: |
          echo "python src/one_py_sdk/tests/sdkTests.py  ${{ secrets.RIO_USERNAME}} ${{secrets.RIO_PASSWORD}} ">> $GITHUB_OUTPUT
           
      - name: Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: aqidedwards@gmail.com
          to: daniel.edwards@aquaticinformatics.com
          subject: GitHub Actions Workflow
          
          body: |
            Workflow run on ${{ github.event_name }} for ${{ github.repository }}.
            ${{ env.KEY }}
            
